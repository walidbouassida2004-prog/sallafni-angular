<section class="view active">
  <div class="auth card">
    <h1>Welcome to Sallafni</h1>
    <p class="muted">Log in first, then choose if you want to borrow or lend.</p>
    <form (submit)="submit($event)" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required [value]="email()" (input)="email.set($any($event.target).value)" />
        @if (emailError()) { <p class="error" role="alert">Enter a valid email address.</p> }
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <div class="pw-wrap">
          <input id="pw" [type]="showPassword() ? 'text' : 'password'" autocomplete="current-password" required [value]="password()" (input)="password.set($any($event.target).value)" />
          <button type="button" class="link" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" (click)="showPassword.set(!showPassword())">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (passwordError()) { <p class="error" role="alert">Password must be at least 8 characters.</p> }
      </div>
      <button class="btn btn-primary block" type="submit">Log in</button>
    </form>
    <p class="muted small center">New here? <a routerLink="/login">Create an account</a></p>
  </div>
</section>
